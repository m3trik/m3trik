name: Refresh API Registry

# Triggered by each ecosystem repo's publish.yml after a successful PyPI upload
# (via repository_dispatch event_type "refresh_api_registry"). Also runs monthly
# as a backstop for any missed dispatches, and supports manual workflow_dispatch.
#
# SCOPE (since 2026-08-23): this job writes ONE file, m3trik/docs/API_SHADOWS.md
# -- the cross-package shadow report, which needs every sibling's source on one
# runner and so cannot be produced inside any single package's CI. The
# per-package registries (API_INDEX/REGISTRY/CHANGES + the JSON sidecar) are
# NOT written here any more: push.ps1's Prepare phase regenerates them inside
# each package's `Release X.Y.Z` commit, and every package PR carries an
# `API registry up to date` check that gates them. Writing them from here as
# well was pure redundancy with real costs -- it was the only source of commits
# to the packages' `dev` branches that no human made, it raced the release
# cascade (fetch+rebase+push into a branch push.ps1 was about to rebase onto),
# it put `[skip ci]` heads on `dev` that left release PRs with zero check runs,
# and it invalidated release receipts for trees whose SOURCE had not changed.
on:
  repository_dispatch:
    types: [refresh_api_registry]
  schedule:
    - cron: '7 13 1 * *'  # Monthly safety net (1st @ 13:07 UTC, off the :00 mark)
  workflow_dispatch:

# Latest-wins: if 4 ecosystem packages publish in quick succession during a
# normal release cascade, only the last refresh has the full picture; cancel
# in-flight refreshes so we don't burn 4 runners producing the same artifact.
concurrency:
  group: refresh-api-registry
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ``contents: write`` lets the default GITHUB_TOKEN push the m3trik
    # shadow report. REPO_DISPATCH_TOKEN is needed only to READ the private
    # sibling (unitytk) when cloning; nothing is pushed cross-repo any more.
    permissions:
      contents: write
    steps:
      - name: Verify cross-repo token
        env:
          TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::REPO_DISPATCH_TOKEN is not set on this repository."
            echo "::error::Add it under Settings → Secrets → Actions with read scope on pythontk/uitk/mayatk/blendertk/tentacle/unitytk/extapps."
            exit 1
          fi

      - name: Checkout m3trik
        uses: actions/checkout@v4
        with:
          ref: main
          path: m3trik

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config --global user.email "agent@m3trik.dev"
          git config --global user.name "api-registry-bot"

      - name: Clone ecosystem repos as siblings of m3trik
        env:
          TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          # Tolerate per-repo clone failures: the refresh should still cover
          # the rest. The generator skips missing siblings gracefully.
          # x-access-token works for both classic PATs and installation tokens.
          #
          # Prefer `dev` (the ecosystem chain's integration branch), but fall
          # back to the repo's DEFAULT branch: `extapps` is a main-only
          # standalone with no `dev`, so an unconditional `--branch dev` clone
          # failed for it every run and the shadow report was generated
          # WITHOUT extapps. That made CI's report permanently disagree with
          # any local run (which has extapps on disk), so
          # check_context_budget.py flagged API_SHADOWS.md stale forever and
          # the two versions ping-ponged on m3trik/main. extapps belongs in
          # the report on merit: it vendors mayatk's Marmoset engine, so its
          # shadows are a real cross-layer DRY surface, not name noise.
          for repo in pythontk uitk mayatk blendertk tentacle unitytk extapps; do
            url="https://m3trik:${TOKEN}@github.com/m3trik/${repo}.git"
            if ! git clone --branch dev "${url}" "${repo}" 2>/dev/null \
               && ! git clone "${url}" "${repo}"; then
              echo "::warning::Failed to clone ${repo} — skipping"
            fi
          done

      - name: Run generator
        run: python m3trik/scripts/generate_api_registry.py

      - name: Commit and push m3trik shadow report
        run: |
          cd m3trik
          if git status --porcelain docs/API_SHADOWS.md | grep -q .; then
            git add docs/API_SHADOWS.md
            git commit -m "chore: refresh API shadow report [skip ci]"
            git push origin main
            echo "m3trik: pushed"
          else
            echo "m3trik: no changes"
          fi

      # LAST on purpose, after the push step. The guard walks the seven sibling
      # clones at their `dev` tips, so it also judges hand-written docs in repos this
      # job neither owns nor can fix (CLAUDE.md sizes, `**Deps**:` lines) --
      # and m3trik/scripts must reach `main` BEFORE the packages land their side of a
      # change (the m3trik-first rule), so a newly added cross-repo check is red by
      # construction for the length of a cascade. Ahead of the push, one package's
      # stale nav line would block the shadow refresh. Behind it the breach still
      # reds the job, so the signal is intact, but the propagation this job exists
      # to perform has already landed.
      - name: Check context budget (repo-side)
        # Gate the agent-facing context surface: CLAUDE.md sizes + registry freshness.
        # Memory-index checks are skipped (the auto-memory dir is local, not in CI);
        # the dispatch and CLAUDE-links checks self-skip without the monorepo root
        # CLAUDE.md. --no-runtime keeps this job import-free (the whole point of the
        # AST registry): runtime-vs-static drift needs importable/DCC runtimes and is
        # checked locally by Check-RuntimeSurface.ps1, not here.
        # Fails the job on a hard budget breach.
        run: python m3trik/scripts/check_context_budget.py --no-memory --no-runtime
