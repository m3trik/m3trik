<svg xmlns="http://www.w3.org/2000/svg" width="1108" height="428" viewBox="0 0 1108 428" role="img" aria-labelledby="t d">
<title id="t">Where tentacle fits</title><desc id="d">tentacle (highlighted) in the m3trik ecosystem: uitk requires pythontk; unitytk requires pythontk; mayatk requires uitk; blendertk requires uitk; tentacle requires uitk; extapps requires uitk; tentacle installs mayatk as its [maya] extra; tentacle installs blendertk as its [blender] extra; tentacle opens extapps by name (its [apps] extra) and never imports it; mayatk and blendertk share a mirrored API. tentacle and extapps are products, which nothing imports.</desc>
