<g class="node"><rect class="nb" x="245.9" y="572.5" width="289" height="103" rx="10"/><g class="ic" transform="translate(261.4 592)"><path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></g><text class="name" x="297.4" y="600">pythontk</text><text class="cap" x="297.4" y="619">Pure-Python core</text><text class="blurb"><tspan x="261.4" y="644">Engines both DCCs share, data</tspan><tspan x="261.4" y="661">contracts, operations and MCP.</tspan></text></g>
<g class="node"><rect class="nb" x="80.9" y="400.5" width="289" height="103" rx="10"/><g class="ic" transform="translate(96.4 420)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></g><text class="name" x="132.4" y="428">uitk</text><text class="cap" x="132.4" y="447">Qt UI framework</text><text class="blurb"><tspan x="96.4" y="472">Name a widget and it connects: a</tspan><tspan x="96.4" y="489">Designer file becomes a tool.</tspan></text></g>
<g class="node"><rect class="nb" x="54.5" y="228.5" width="289" height="103" rx="10"/><g class="ic" transform="translate(70 248)"><path d="M12 2.8 20 7.4v9.2l-8 4.6-8-4.6V7.4z"/><path d="m4 7.4 8 4.6 8-4.6M12 12v9.2"/></g><text class="name" x="106" y="256">mayatk</text><text class="cap" x="106" y="275">Maya 2025+ library</text><text class="blurb"><tspan x="70" y="300">Every tool&#x27;s Maya half, on maya.cmds</tspan><tspan x="70" y="317">and OpenMaya. No PyMEL.</tspan></text></g>
