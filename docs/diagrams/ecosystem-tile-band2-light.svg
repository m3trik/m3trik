<svg xmlns="http://www.w3.org/2000/svg" width="781" height="68" viewBox="0 462 781 68" role="img" aria-labelledby="t d">
<title id="t">The ecosystem</title><desc id="d">The ecosystem: uitk requires pythontk; unitytk requires pythontk; mayatk requires uitk; blendertk requires uitk; tentacle requires uitk; extapps requires uitk; tentacle installs mayatk as its [maya] extra; tentacle installs blendertk as its [blender] extra; tentacle opens extapps by name (its [apps] extra) and never imports it; mayatk and blendertk share a mirrored API. tentacle and extapps are products, which nothing imports.</desc>
<style>.card{fill:#f6f8fa;stroke:#d1d9e0}.title{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.08em;fill:#59636e}.nb{fill:#ffffff;stroke:#d1d9e0}.product .nb{stroke:#59636e}.focus .nb{fill:#ddf4ff;stroke:#0969da;stroke-width:1.75}.name{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}.cap{font:12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}.blurb{font:12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#424a53}.ic{fill:none;stroke:#59636e;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.focus .ic{stroke:#0969da}.go{fill:none;stroke:#818b98;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.w{fill:none;stroke:#818b98;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.extra{stroke-dasharray:6 4}.opens,.pair{stroke-dasharray:.5 4.5;stroke-width:2}.hl{fill:none;stroke:#0969da;stroke-width:2.25;stroke-linecap:round}.pill rect{fill:#f6f8fa;stroke:#d1d9e0}.pill text{font:11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}.msg rect{fill:#ddf4ff;stroke:#0969da}.msg text{font:11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}.chip rect{fill:#ffffff;stroke:#59636e}.chip text{font:600 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.06em;fill:#59636e}.chip.here rect{fill:#0969da;stroke:#0969da}.chip.here text{fill:#ffffff}.rule{stroke:#d1d9e0}.legend text{font:12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}.say{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}.dot{fill:#d1d9e0}.dot.on{fill:#0969da}.dim{opacity:.3}.pkt{fill:#0969da}.pkt.ring{fill:#f6f8fa;stroke:#0969da;stroke-width:1.5}.pulse{fill:none;stroke:#0969da;stroke-width:1.5}@media (prefers-reduced-motion:reduce){.pkt,.pulse{display:none}.st{display:none}.s0{display:inline;opacity:1!important}}</style>
