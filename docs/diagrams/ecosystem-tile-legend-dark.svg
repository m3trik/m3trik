<svg xmlns="http://www.w3.org/2000/svg" width="781" height="84" viewBox="0 634 781 84" role="img" aria-labelledby="t d">
<title id="t">The ecosystem</title><desc id="d">The ecosystem: uitk requires pythontk; unitytk requires pythontk; mayatk requires uitk; blendertk requires uitk; tentacle requires uitk; extapps requires uitk; tentacle installs mayatk as its [maya] extra; tentacle installs blendertk as its [blender] extra; tentacle opens extapps by name (its [apps] extra) and never imports it; mayatk and blendertk share a mirrored API. tentacle and extapps are products, which nothing imports.</desc>
<style>.card{fill:#151b23;stroke:#3d444d}.title{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.08em;fill:#9198a1}.nb{fill:#0d1117;stroke:#3d444d}.product .nb{stroke:#9198a1}.focus .nb{fill:#0f2a4a;stroke:#4493f8;stroke-width:1.75}.name{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc}.cap{font:12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#9198a1}.blurb{font:12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#d1d7e0}.ic{fill:none;stroke:#9198a1;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.focus .ic{stroke:#4493f8}.go{fill:none;stroke:#656c76;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.w{fill:none;stroke:#656c76;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.extra{stroke-dasharray:6 4}.opens,.pair{stroke-dasharray:.5 4.5;stroke-width:2}.hl{fill:none;stroke:#4493f8;stroke-width:2.25;stroke-linecap:round}.pill rect{fill:#151b23;stroke:#3d444d}.pill text{font:11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#9198a1}.msg rect{fill:#0f2a4a;stroke:#4493f8}.msg text{font:11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f0f6fc}.chip rect{fill:#0d1117;stroke:#9198a1}.chip text{font:600 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.06em;fill:#9198a1}.chip.here rect{fill:#4493f8;stroke:#4493f8}.chip.here text{fill:#ffffff}.rule{stroke:#3d444d}.legend text{font:12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#9198a1}.say{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc}.dot{fill:#3d444d}.dot.on{fill:#4493f8}.dim{opacity:.3}.pkt{fill:#4493f8}.pkt.ring{fill:#151b23;stroke:#4493f8;stroke-width:1.5}.pulse{fill:none;stroke:#4493f8;stroke-width:1.5}@media (prefers-reduced-motion:reduce){.pkt,.pulse{display:none}.st{display:none}.s0{display:inline;opacity:1!important}}</style>
