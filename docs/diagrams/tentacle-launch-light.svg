<svg xmlns="http://www.w3.org/2000/svg" width="1108" height="316" viewBox="0 0 1108 316" role="img" aria-labelledby="t d">
<title id="t">How tentacle starts</title><desc id="d">How tentacle starts: Tcl.launch resolves the host&#x27;s adapter and defers to Tcl.build, which makes one uitk MarkingMenu with that adapter as its host; the menu&#x27;s Switchboard pairs a ui/&lt;name&gt;.ui file with the slots/&lt;name&gt;.py Slots class of the same basename, and a widget&#x27;s objectName calls the Slots method of the same name.</desc>
<style>.card{fill:#f6f8fa;stroke:#d1d9e0}.title{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.08em;fill:#59636e}.nb{fill:#ffffff;stroke:#d1d9e0}.product .nb{stroke:#59636e}.focus .nb{fill:#ddf4ff;stroke:#0969da;stroke-width:1.75}.name{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}.cap{font:12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}.ic{fill:none;stroke:#59636e;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.focus .ic{stroke:#0969da}.w{fill:none;stroke:#818b98;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.extra{stroke-dasharray:6 4}.opens,.pair{stroke-dasharray:.5 4.5;stroke-width:2}.pill rect{fill:#f6f8fa;stroke:#d1d9e0}.pill text{font:11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}.chip rect{fill:#ffffff;stroke:#59636e}.chip text{font:600 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.06em;fill:#59636e}.chip.here rect{fill:#0969da;stroke:#0969da}.chip.here text{fill:#ffffff}.rule{stroke:#d1d9e0}.legend text{font:12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}.dim{opacity:.3}.pkt{fill:#0969da}.pkt.ring{fill:#f6f8fa;stroke:#0969da;stroke-width:1.5}.pulse{fill:none;stroke:#0969da;stroke-width:1.5}@media (prefers-reduced-motion:reduce){.pkt,.pulse{display:none}}</style>
